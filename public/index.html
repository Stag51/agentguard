<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGuard Dashboard</title>
<meta name="description" content="Evaluation results for LLM agents: quality, cost and latency per run.">
<style>
  :root {
    --bg: #fafaf8; --surface: #ffffff; --ink: #1b1d1f; --muted: #646a70; --line: #e3e3de;
    --accent: #1f6feb; --good: #1a7f4b; --bad: #c0392b; --warn: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121416; --surface: #1b1e21; --ink: #ecedee; --muted: #9aa0a6; --line: #2d3236;
      --accent: #6aa5ff; --good: #4cc38a; --bad: #ff7b6e; --warn: #e0b04a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121416; --surface: #1b1e21; --ink: #ecedee; --muted: #9aa0a6; --line: #2d3236;
    --accent: #6aa5ff; --good: #4cc38a; --bad: #ff7b6e; --warn: #e0b04a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  .notice { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--warn); padding: 10px 14px; border-radius: 6px; margin: 12px 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 24px; font-weight: 600; margin: 2px 0 6px; }
  svg { width: 100%; height: 56px; display: block; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; }
  tr.row { cursor: pointer; }
  tr.row:hover, tr.row.sel { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .wrap { overflow-x: auto; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .pill.mock { color: var(--warn); border-color: var(--warn); }
  .bar { display: grid; grid-template-columns: 150px 1fr 48px; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
  .bar .track { background: var(--line); border-radius: 4px; height: 10px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); }
  .fail { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; font-size: 13px; overflow-wrap: anywhere; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>AgentGuard</h1>
  <p class="sub">Does the agent still do its job? Quality, cost and latency for every evaluation run.</p>
  <div id="status" class="muted">Loading…</div>
  <div id="notice"></div>
  <section id="cards" class="cards"></section>
  <h2>Runs <span class="muted">(click a row for detail)</span></h2>
  <div class="wrap"><table id="runs"></table></div>
  <section id="detail"></section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmtPct = (x) => (x * 100).toFixed(0) + "%";
const fmtCost = (x) => "$" + x.toFixed(6);
const backend = (r) => (r.agent_version.match(/\/(\w+)\]$/) || [])[1] || "?";

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  for (const k of kids) e.append(k);
  return e;
}

// Minimal sparkline: values left-to-right, no library.
function spark(values, color) {
  const ns = "http://www.w3.org/2000/svg", w = 200, h = 56, pad = 4;
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("preserveAspectRatio", "none");
  if (values.length < 2) return svg;
  const lo = Math.min(...values), hi = Math.max(...values), span = hi - lo || 1;
  const pts = values.map((v, i) => [pad + (i * (w - 2 * pad)) / (values.length - 1), h - pad - ((v - lo) / span) * (h - 2 * pad)]);
  const line = document.createElementNS(ns, "polyline");
  line.setAttribute("points", pts.map((p) => p.join(",")).join(" "));
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width", "2");
  line.setAttribute("vector-effect", "non-scaling-stroke");
  svg.append(line);
  return svg;
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " -> " + r.status);
  return r.json();
}

function card(label, value, series, color) {
  return el("div", { className: "card" }, el("div", { className: "label", textContent: label }), el("div", { className: "value num", textContent: value }), spark(series, color));
}

async function showDetail(run) {
  const box = $("detail");
  box.replaceChildren(el("h2", { textContent: "Run " + run.id + " · " + run.agent_version }));
  const tags = Object.entries(run.success_by_tag);
  for (const [tag, v] of tags) {
    const fill = el("div", { className: "fill" });
    fill.style.width = fmtPct(v);
    box.append(el("div", { className: "bar" }, el("span", { textContent: tag }), el("div", { className: "track" }, fill), el("span", { className: "num", textContent: fmtPct(v) })));
  }
  box.append(el("h2", { textContent: "Why cases failed" }));
  try {
    const fails = (await getJSON("/api/runs/" + run.id + "/failures")).slice(0, 15);
    if (!fails.length) box.append(el("div", { className: "muted", textContent: "No failing checks in this run." }));
    for (const f of fails) {
      const ev = f.evidence || {};
      const why = f.metric === "required_facts" ? "missing: " + (ev.missing || []).join(", ")
        : f.metric === "tool_calls" ? "expected " + (ev.missing || []).map((m) => m.name).join(", ") + "; called " + (ev.actual || []).map((c) => c.name).join(", ")
        : JSON.stringify(ev).slice(0, 160);
      box.append(el("div", { className: "fail" }, el("b", { textContent: f.case_id + " · " + f.metric + " " }), el("span", { className: "muted", textContent: why })));
    }
  } catch (e) {
    box.append(el("div", { className: "muted", textContent: "Could not load failures." }));
  }
}

function renderTable(runs) {
  const t = $("runs");
  t.replaceChildren(el("tr", {}, ...["Run", "Label", "Model", "Status", "Success", "Tools", "Cost/task", "p95 ms"].map((h) => el("th", { textContent: h }))));
  for (const r of runs) {
    const b = backend(r);
    const tr = el("tr", { className: "row" },
      el("td", { textContent: r.id }), el("td", { textContent: r.label || "" }),
      el("td", {}, el("span", { className: "pill " + (b === "mock" ? "mock" : ""), textContent: b })),
      el("td", { textContent: r.status }),
      el("td", { className: "num", textContent: fmtPct(r.success_rate) }),
      el("td", { className: "num", textContent: fmtPct(r.tool_correctness) }),
      el("td", { className: "num", textContent: fmtCost(r.cost_per_task) }),
      el("td", { className: "num", textContent: r.p95_latency_ms.toFixed(0) }));
    tr.onclick = () => { document.querySelectorAll("tr.row").forEach((x) => x.classList.remove("sel")); tr.classList.add("sel"); showDetail(r); };
    t.append(tr);
  }
}

(async () => {
  try {
    const runs = await getJSON("/api/runs?limit=30");
    if (!runs.length) { $("status").textContent = "No runs yet. Run `agentguard run` against this database first."; return; }
    $("status").textContent = runs.length + " runs · newest first";
    const chrono = [...runs].reverse(), latest = runs[0];
    if (runs.some((r) => backend(r) === "mock"))
      $("notice").append(el("div", { className: "notice", textContent: "Rows marked “mock” come from an offline simulated model. They show the evaluation machinery works, not how a real model behaves." }));
    $("cards").append(
      card("Success rate (latest)", fmtPct(latest.success_rate), chrono.map((r) => r.success_rate), "var(--good)"),
      card("Cost per task (latest)", fmtCost(latest.cost_per_task), chrono.map((r) => r.cost_per_task), "var(--accent)"),
      card("p95 latency (latest)", latest.p95_latency_ms.toFixed(0) + " ms", chrono.map((r) => r.p95_latency_ms), "var(--warn)"));
    renderTable(runs);
  } catch (e) {
    $("status").textContent = "Could not load runs. Check /api/health (is DATABASE_URL set?).";
  }
})();
</script>
</body>
</html>
